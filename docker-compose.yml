# Локальная разработка: поднимается только БД.
# Для прода позже добавится сервис web (Next.js) и mcp-server.
name: proj-3311

services:
  db:
    image: postgres:16
    container_name: horizon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: horizon
    ports:
      - "5432:5432"
    volumes:
      - horizon-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d horizon"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  horizon-db-data:
