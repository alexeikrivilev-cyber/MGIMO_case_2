services:
  db:
    image: postgres:16
    container_name: horizon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - horizon-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: udgu-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      # Приватное хранилище фото студбилетов: именованный том, чтобы файлы
      # пережили пересборку образа. Секретов здесь нет — только путь.
      STORAGE_DIR: ${STORAGE_DIR:-/app/storage}
    ports:
      - "3000:3000"
    volumes:
      - udgu-storage-data:/app/storage

volumes:
  horizon-db-data:
  udgu-storage-data:
