<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Знак концепта «Цифровой деканат»">
  <title>Знак концепта «Цифровой деканат»</title>
  <!-- Плитка знака: фон — тёмный токен bg, лёгкая внутренняя рамка — surface-2 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#0b0e14" />
  <rect x="28" y="28" width="456" height="456" rx="90" fill="none" stroke="#1b2233" stroke-width="6" />
  <!-- Страница-расписание: контур — primary, строки пар — primary-hover -->
  <rect x="112" y="96" width="288" height="288" rx="44" fill="none" stroke="#818cf8" stroke-width="26" />
  <line x1="152" y1="190" x2="344" y2="190" stroke="#a5b4fc" stroke-width="22" stroke-linecap="round" />
  <line x1="152" y1="242" x2="280" y2="242" stroke="#a5b4fc" stroke-width="22" stroke-linecap="round" />
  <!-- Печать «всё учтено»: галочка контроля внутри страницы -->
  <polyline points="150,300 204,352 348,240" fill="none" stroke="#818cf8" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
</svg>
